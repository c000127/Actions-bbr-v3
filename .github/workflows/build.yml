name: 构建 VPS 优化的 BBRv3 内核（XanMod）

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 内核配置
        type: choice
        options: [standard, aggressive]
        default: standard
      xanmod_tag:
        description: 可选：指定 XanMod 标签（留空使用最新版本）
        type: string
        default: ''
      publish:
        description: 发布 GitHub Release
        type: boolean
        default: true
  workflow_call:
    inputs:
      profile:
        description: standard or aggressive
        required: false
        default: standard
        type: string
      xanmod_tag:
        description: Exact XanMod tag selected by the coordinating workflow
        required: false
        default: ''
        type: string
      source_commit:
        description: Exact upstream commit selected by the coordinating workflow
        required: false
        default: ''
        type: string
      fingerprint:
        description: Expected paired build input fingerprint
        required: false
        default: ''
        type: string
      publish:
        description: Publish a GitHub release
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-latest
    runs-on: ${{ matrix.runs_on }}
    concurrency:
      group: kernel-${{ github.repository }}-${{ matrix.arch }}-${{ inputs.profile || 'standard' }}
      cancel-in-progress: false
    env:
      ARCH: ${{ matrix.arch }}
      KERNEL_VERSION: ""
      PROFILE: ${{ inputs.profile || 'standard' }}
      REQUESTED_XANMOD_TAG: ${{ inputs.xanmod_tag || '' }}
      REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit || '' }}
      REQUESTED_FINGERPRINT: ${{ inputs.fingerprint || '' }}
    steps:
      - name: 🗑️ 释放构建环境磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache &
          wait
          sudo apt-get clean
          df -h /

      - name: 📋 获取最新 XanMod 内核版本
        id: get_kernel_version
        run: |
          set -euo pipefail

          # 从 XanMod GitLab 获取最新 tag（所有分支中版本最高的）
          # tag 格式: 7.0.2-xanmod1 或 6.18.25-xanmod1
          # GitLab 从 Actions 连接不稳定，加重试
          XANMOD_TAG="${REQUESTED_XANMOD_TAG:-}"
          if [[ -z "$XANMOD_TAG" ]]; then
            for attempt in 1 2 3; do
              echo "尝试 #${attempt} 获取 XanMod tag..."
              XANMOD_TAG=$(git -c 'versionsort.suffix=-rc' ls-remote \
                --tags --refs --sort=-version:refname \
                https://gitlab.com/xanmod/linux.git \
                "*-xanmod*" 2>/dev/null \
                | awk 'NR == 1 { sub("^refs/tags/", "", $2); tag=$2 } END { print tag }') || true
              if [[ -n "$XANMOD_TAG" ]]; then
                break
              fi
              echo "  失败，等待 5 秒后重试..."
              sleep 5
            done
          fi

          if [[ -z "$XANMOD_TAG" ]]; then
            echo "::error::无法从 XanMod GitLab 获取最新 tag（3 次重试均失败）"
            exit 1
          fi
          if [[ ! "$XANMOD_TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-rc[0-9]+)?-xanmod[0-9]+$ ]]; then
            echo "::error::不支持的 XanMod tag: $XANMOD_TAG"
            exit 1
          fi

          echo "最新 XanMod tag: $XANMOD_TAG"

          # 提取内核版本号（去掉 -xanmodN 后缀）
          KERNEL_VERSION=$(echo "$XANMOD_TAG" | sed 's/-xanmod[0-9]*$//')
          # 提取 XanMod 分支号（如 7.0、6.18）
          XANMOD_BRANCH=$(echo "$KERNEL_VERSION" | grep -oP '^\d+\.\d+')
          echo "内核版本: $KERNEL_VERSION"
          echo "XanMod 分支: $XANMOD_BRANCH"

          echo "获取到内核版本: $KERNEL_VERSION (XanMod: $XANMOD_TAG)"
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "XANMOD_TAG=$XANMOD_TAG" >> $GITHUB_ENV
          echo "XANMOD_BRANCH=$XANMOD_BRANCH" >> $GITHUB_ENV
          case "$PROFILE" in
            standard)
              echo "RELEASE_TAG=${ARCH}-${KERNEL_VERSION}" >> "$GITHUB_ENV"
              echo "CACHE_PREFIX=ccache-${ARCH}-${XANMOD_BRANCH}-" >> "$GITHUB_ENV"
              echo "PROFILE_SUFFIX=" >> "$GITHUB_ENV"
              ;;
            aggressive)
              if [[ "$ARCH" != "x86_64" ]]; then
                echo "::error::激进版目前只支持 x86_64"
                exit 1
              fi
              echo "RELEASE_TAG=aggressive-${ARCH}-${KERNEL_VERSION}" >> "$GITHUB_ENV"
              echo "CACHE_PREFIX=ccache-aggressive-${ARCH}-${XANMOD_BRANCH}-" >> "$GITHUB_ENV"
              echo "PROFILE_SUFFIX=-aggressive" >> "$GITHUB_ENV"
              ;;
            *) echo "::error::未知构建配置: $PROFILE"; exit 1 ;;
          esac
          # 构建时间戳（精确到分钟），用于区分同一内核版本的多次编译
          echo "BUILD_TIMESTAMP=$(date -u +%Y%m%d%H%M)" >> $GITHUB_ENV

      - name: 📥 检出仓库代码
        uses: actions/checkout@v7

      - name: 🔧 安装构建依赖（最新版工具链）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAIL_COUNT=0
          GH_API="Authorization: Bearer ${GH_TOKEN}"

          # 辅助函数：获取 GitHub 最新 release tag（去掉 v 前缀）
          gh_latest() {
            curl -sf -H "${GH_API}" "https://api.github.com/repos/$1/releases/latest" | jq -r .tag_name | tr -d 'v'
          }

          # ===== 1. GCC 16（最新版编译器）=====
          echo "===== [1/5] GCC 16 ====="
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          # 不安装 cmake（系统自带 3.31.6，apt 仓库只有 3.28.3 会降级）
          sudo apt-get install -y --no-install-recommends \
            gcc-16 g++-16 \
            git build-essential ccache \
            libncurses-dev libssl-dev libelf-dev libdw-dev \
            bison bc flex rsync debhelper \
            dpkg-dev fakeroot kmod cpio dwarves \
            lz4 zstd xz-utils curl jq patch
          # 设置 GCC 16 为默认编译器
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 160 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-16 \
            --slave /usr/bin/gcov gcov /usr/bin/gcov-16
          echo "✅ GCC 16 安装完成: $(gcc-16 --version | head -1)"

          # ===== 2. ccache（最新版编译缓存）=====
          echo "===== [2/5] ccache ====="
          if CCACHE_VER=$(gh_latest ccache/ccache) && [ -n "${CCACHE_VER}" ]; then
            echo "升级 ccache → ${CCACHE_VER}"
            mkdir -p /tmp/ccache-install
            if curl -fL "https://github.com/ccache/ccache/releases/download/v${CCACHE_VER}/ccache-${CCACHE_VER}-linux-$(uname -m).tar.xz" \
              -o /tmp/ccache.tar.xz; then
              tar -xJf /tmp/ccache.tar.xz -C /tmp/ccache-install --strip-components=1
              sudo install -m 755 /tmp/ccache-install/ccache /usr/bin/ccache
              for prog in gcc g++ cc c++ gcc-16 g++-16; do
                sudo ln -sf /usr/bin/ccache "/usr/lib/ccache/${prog}"
              done
              echo "✅ ccache 升级完成: $(ccache --version | head -1)"
            else
              echo "⚠️ ccache 二进制下载失败，保留 apt 版本"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          else
            echo "⚠️ 无法获取 ccache 最新版本号，保留 apt 版本"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi

          # ===== 3. pahole/dwarves（最新版 BTF 生成工具）=====
          echo "===== [3/5] pahole/dwarves ====="
          # acmel/dwarves 没有 GitHub Releases，使用 git tags 获取最新版本
          if PAHOLE_VER=$(curl -sf -H "${GH_API}" "https://api.github.com/repos/acmel/dwarves/tags?per_page=1" | jq -r '.[0].name' | tr -d 'v') && [ -n "${PAHOLE_VER}" ] && [ "${PAHOLE_VER}" != "null" ]; then
            echo "升级 pahole → ${PAHOLE_VER}"
            if git clone --depth=1 --branch "v${PAHOLE_VER}" https://github.com/acmel/dwarves.git /tmp/dwarves 2>&1; then
              cmake -S /tmp/dwarves -B /tmp/dwarves/build \
                -DCMAKE_INSTALL_PREFIX=/usr -D__LIB=lib -DCMAKE_BUILD_TYPE=Release
              make -C /tmp/dwarves/build -j"$(nproc)"
              sudo make -C /tmp/dwarves/build install
              echo "✅ pahole 升级完成: $(pahole --version 2>&1 | head -1)"
            else
              echo "⚠️ pahole 源码克隆/构建失败，保留 apt 版本 (1.25)"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          else
            echo "⚠️ 无法获取 pahole 最新版本号，保留 apt 版本 (1.25)"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi

          # ===== 4. zstd（最新版压缩工具）=====
          echo "===== [4/5] zstd ====="
          if ZSTD_VER=$(gh_latest facebook/zstd) && [ -n "${ZSTD_VER}" ]; then
            echo "升级 zstd → ${ZSTD_VER}"
            if curl -fL "https://github.com/facebook/zstd/releases/download/v${ZSTD_VER}/zstd-${ZSTD_VER}.tar.gz" \
              | tar -xz -C /tmp; then
              make -C "/tmp/zstd-${ZSTD_VER}" -j"$(nproc)"
              sudo make -C "/tmp/zstd-${ZSTD_VER}" install PREFIX=/usr
              echo "✅ zstd 升级完成: $(zstd --version 2>&1 | head -1)"
            else
              echo "⚠️ zstd 源码下载/构建失败，保留系统版本"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          else
            echo "⚠️ 无法获取 zstd 最新版本号，保留系统版本"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi

          # ===== 5. lz4（最新版压缩工具）=====
          echo "===== [5/5] lz4 ====="
          if LZ4_VER=$(gh_latest lz4/lz4) && [ -n "${LZ4_VER}" ]; then
            echo "升级 lz4 → ${LZ4_VER}"
            if curl -fL "https://github.com/lz4/lz4/releases/download/v${LZ4_VER}/lz4-${LZ4_VER}.tar.gz" \
              | tar -xz -C /tmp; then
              make -C "/tmp/lz4-${LZ4_VER}" -j"$(nproc)"
              sudo make -C "/tmp/lz4-${LZ4_VER}" install PREFIX=/usr
              echo "✅ lz4 升级完成: $(lz4 --version 2>&1 | head -1)"
            else
              echo "⚠️ lz4 源码下载/构建失败，保留系统版本"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          else
            echo "⚠️ 无法获取 lz4 最新版本号，保留系统版本"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi

          # 更新动态链接器缓存
          sudo ldconfig

          echo ""
          echo "===== 工具升级汇总 ====="
          if [ "${FAIL_COUNT}" -eq 0 ]; then
            echo "✅ 全部 5 个工具升级成功"
          else
            echo "⚠️ ${FAIL_COUNT} 个工具升级失败（已回退到 apt/系统版本）"
          fi

      - name: 🚀 准备 ccache 环境
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          mkdir -p ${{ github.workspace }}/.ccache

      - name: 📦 恢复 ccache 缓存
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          # 每次构建使用唯一 key（run_id + run_attempt），确保重跑也能保存新缓存
          # 恢复时按 arch+xanmod_branch 前缀匹配最近一次缓存
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}

      - name: 🔧 配置 ccache 编译加速
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          # 配置在缓存恢复之后执行，确保设置不被旧缓存覆盖
          # 单次 depend_mode 编译约 1.5~1.8 GiB，3G 足够容纳一次完整构建加增量余量
          ccache --max-size=3G
          # 按文件内容校验编译器（避免路径变化导致缓存失效）
          ccache --set-config=compiler_check=content
          # 启用压缩，节省缓存空间（level 6 压缩率/速度平衡）
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          # depend 模式：跳过预处理阶段直接使用依赖信息，大幅提升缓存命中
          ccache --set-config=depend_mode=true
          # 宽松匹配：忽略 __FILE__、时间戳、include_file 等宏差异
          # system_headers：缓存系统头文件的编译结果（内核编译大量引用）
          ccache --set-config=sloppiness=file_macro,locale,time_macros,pch_defines,include_file_mtime,include_file_ctime,system_headers
          # 直接存储编译结果到缓存（跳过临时文件，减少 I/O）
          ccache --set-config=direct_mode=true
          # 忽略 header 时间戳变化（GitHub Actions 每次 clone 时间戳都不同）
          ccache --set-config=inode_cache=true
          # 清除旧统计，确保本次构建的命中率数据准确
          ccache -z
          echo "ccache 配置完成:"
          ccache -p | grep -E 'max_size|compression|depend_mode|sloppiness|direct_mode'

      - name: ⬇️ 下载 XanMod 内核源代码
        run: |
          set -euo pipefail
          mkdir -p ./kernel
          echo "克隆 XanMod linux @ ${{ env.XANMOD_TAG }} ..."
          # GitLab 从 Actions 连接不稳定，加重试
          for attempt in 1 2 3; do
            echo "尝试 #${attempt} 克隆..."
            rm -rf ./kernel/linux
            if git clone --depth=1 --single-branch --no-tags \
              --branch "${{ env.XANMOD_TAG }}" \
              https://gitlab.com/xanmod/linux.git ./kernel/linux 2>&1; then
              echo "✅ 克隆成功"
              break
            fi
            echo "  失败，等待 10 秒后重试..."
            sleep 10
          done
          if [[ ! -d ./kernel/linux/.git ]]; then
            echo "::error::XanMod 内核克隆失败（3 次重试均失败）"
            exit 1
          fi
          echo "内核源码下载完成，目录大小: $(du -sh ./kernel/linux | cut -f1)"

      - name: 🔐 固定并记录双版本构建来源
        run: |
          set -euo pipefail
          source_commit=$(git -C ./kernel/linux rev-parse HEAD)
          if [[ -n "$REQUESTED_SOURCE_COMMIT" && "$source_commit" != "$REQUESTED_SOURCE_COMMIT" ]]; then
            echo "::error::上游标签指向的提交已变化，停止构建"
            exit 1
          fi
          fingerprint=$(python3 scripts/build_provenance.py fingerprint "$XANMOD_TAG" "$source_commit")
          if [[ -n "$REQUESTED_FINGERPRINT" && "$fingerprint" != "$REQUESTED_FINGERPRINT" ]]; then
            echo "::error::构建输入与双版本计划不一致"
            exit 1
          fi
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || { echo "::error::无效的 Actions 构建编号"; exit 1; }
          printf -v run_hex '%x' "$GITHUB_RUN_ID"
          build_suffix="-b${fingerprint:0:10}r${run_hex}a${GITHUB_RUN_ATTEMPT}"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "BUILD_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          echo "BUILD_SUFFIX=$build_suffix" >> "$GITHUB_ENV"

      - name: ✅ 验证 BBRv3 内置
        working-directory: ./kernel/linux
        run: |
          set -euo pipefail
          echo "=== 验证 XanMod 内核包含 BBRv3 ==="

          # 检测 BBRv3 特征
          if grep -qP '^#define\s+BBR_VERSION\s+3\s*$' net/ipv4/tcp_bbr.c 2>/dev/null; then
            echo "✅ BBR_VERSION = 3 确认"
          else
            echo "::error::无法确认 BBRv3，拒绝发布未经验证的内核"
            exit 1
          fi

          if grep -q 'bbr_ecn_alpha' net/ipv4/tcp_bbr.c 2>/dev/null; then
            echo "✅ bbr_ecn_alpha 存在"
          fi

          if grep -q 'bbr_loss_thresh' net/ipv4/tcp_bbr.c 2>/dev/null; then
            echo "✅ bbr_loss_thresh 存在"
          fi

          BBR_LINES=$(wc -l < net/ipv4/tcp_bbr.c)
          echo "tcp_bbr.c: ${BBR_LINES} 行"

          # 记录补丁信息（用于 Release 说明）
          {
            echo "PATCH_LINES<<PATCH_EOF"
            echo "| BBRv3 | XanMod 内置 (google/bbr v3) |"
            echo "PATCH_EOF"
          } >> $GITHUB_ENV

      - name: ⚡ 应用独立的激进 BBRv3 配置
        if: env.PROFILE == 'aggressive'
        working-directory: ./kernel/linux
        run: |
          set -euo pipefail
          python3 "${{ github.workspace }}/scripts/apply-aggressive-bbr.py" net/ipv4/tcp_bbr.c

      - name: 🔢 更新 Makefile 版本号
        working-directory: ./kernel/linux
        run: |
          set -euo pipefail
          # 增加容错处理，防止 RC 版本导致变量为空
          v=$(echo "${{ env.KERNEL_VERSION }}" | cut -d. -f1)
          p=$(echo "${{ env.KERNEL_VERSION }}" | cut -d. -f2 | cut -d- -f1)
          s=$(echo "${{ env.KERNEL_VERSION }}" | cut -d. -f3 | cut -d- -f1)
          # RC 版本或两段版本号（如 7.0-rc1）会导致 SUBLEVEL 为空，默认置 0
          s=${s:-0}

          echo "Makefile 版本: VERSION=$v PATCHLEVEL=$p SUBLEVEL=$s"
          sed -i "s/^VERSION *=.*/VERSION = $v/" Makefile
          sed -i "s/^PATCHLEVEL *=.*/PATCHLEVEL = $p/" Makefile
          sed -i "s/^SUBLEVEL *=.*/SUBLEVEL = $s/" Makefile

      - name: ⚙️ 准备内核配置
        working-directory: ./kernel/linux
        run: |
          set -euo pipefail
          if [ "$PROFILE" = "aggressive" ]; then
            cp "${{ github.workspace }}/x86-64-aggressive.config" .config
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            cp ${{ github.workspace }}/arm64.config .config
          else
            cp ${{ github.workspace }}/x86-64.config .config
          fi

          scripts/config --disable SYSTEM_TRUSTED_KEYS
          scripts/config --disable SYSTEM_REVOCATION_KEYS
          # Each build has a distinct kernel release, so reinstalling a changed
          # build cannot replace modules for the currently running kernel.
          scripts/config --set-str LOCALVERSION "${BUILD_SUFFIX}${PROFILE_SUFFIX}"

          # === 编译性能优化：使用 ZSTD 替代 XZ 压缩（压缩速度快 3 倍，解压更快） ===
          scripts/config --disable KERNEL_XZ
          scripts/config --enable KERNEL_ZSTD

          # === 网络性能优化 ===
          # BPF JIT 始终开启，提升 BPF 网络程序性能
          scripts/config --enable BPF_JIT_ALWAYS_ON
          # 启用 TCP 认证选项（RFC 5925，现代数据中心网络）
          scripts/config --enable TCP_AO
          # 启用 PAGE_POOL 统计，便于网络性能监控
          scripts/config --enable PAGE_POOL_STATS
          # 确保微码加载已启用（7.0 合并了 Intel/AMD 为统一 MICROCODE 选项）
          scripts/config --enable MICROCODE

          # === BBRv3 拥塞控制（XanMod 已内置，确保设为默认）===
          scripts/config --enable TCP_CONG_BBR
          scripts/config --enable DEFAULT_BBR
          scripts/config --set-str DEFAULT_TCP_CONG bbr
          scripts/config --enable NET_SCH_FQ
          scripts/config --enable DEFAULT_FQ
          scripts/config --set-str DEFAULT_NET_SCH fq

          # === VPS 内存优化 ===
          # 默认启用 zswap 压缩交换缓存
          scripts/config --enable ZSWAP_DEFAULT_ON

          # === 适合 VPS 的定时器：NO_HZ_IDLE 替代 NO_HZ_FULL ===
          # NO_HZ_FULL 需要 context tracking 开销大，NO_HZ_IDLE 对 VPS 更合适
          scripts/config --disable NO_HZ_FULL
          scripts/config --enable NO_HZ_IDLE
          scripts/config --disable VIRT_CPU_ACCOUNTING_GEN

          # === 禁用 VPS 不需要的硬件驱动（减少编译时间约 40%） ===
          scripts/config --disable SOUND
          # DRM: 保留核心框架（VPS 控制台依赖 BOCHS/QXL/VIRTIO_GPU），仅禁用物理显卡驱动
          scripts/config --disable DRM_RADEON
          scripts/config --disable DRM_AMDGPU
          scripts/config --disable DRM_NOUVEAU
          scripts/config --disable DRM_I915
          scripts/config --disable DRM_GMA500
          scripts/config --disable WLAN
          scripts/config --disable WIRELESS
          scripts/config --disable CFG80211
          scripts/config --disable MAC80211
          scripts/config --disable BLUETOOTH
          scripts/config --disable BT
          scripts/config --disable INFINIBAND
          scripts/config --disable MEDIA_SUPPORT
          scripts/config --disable RC_CORE
          scripts/config --disable USB_GADGET
          scripts/config --disable STAGING
          scripts/config --disable COMEDI
          scripts/config --disable GREYBUS
          scripts/config --disable PCMCIA
          scripts/config --disable NFC
          scripts/config --disable HAMRADIO
          scripts/config --disable CAN
          scripts/config --disable CAIF
          scripts/config --disable ARCNET
          scripts/config --disable FDDI
          scripts/config --disable HIPPI
          scripts/config --disable ATM_DRIVERS
          scripts/config --disable ISDN
          scripts/config --disable INPUT_JOYSTICK
          scripts/config --disable INPUT_TOUCHSCREEN
          scripts/config --disable INPUT_TABLET
          scripts/config --disable GAMEPORT
          scripts/config --disable ACCESSIBILITY

          # ================================================================
          # === VPS 保守性能优化 ===
          # ================================================================

          # --- 启用 BTF（eBPF CO-RE 必需，现代可观测性基础）---
          # 需要 pahole（已在工具链步骤中安装最新版）
          scripts/config --disable DEBUG_INFO_NONE
          scripts/config --enable DEBUG_INFO
          scripts/config --enable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          scripts/config --enable DEBUG_INFO_BTF
          scripts/config --enable DEBUG_INFO_BTF_MODULES

          # --- RCU 优化：卸载回调到专用线程 ---
          # 减少延迟尖峰，对 VPS 负载有益
          scripts/config --enable RCU_NOCB_CPU_DEFAULT_ALL

          # --- TEO CPU 空闲管理器 ---
          # Timer Events Oriented：比 menu 更智能地预测空闲时长
          scripts/config --enable CPU_IDLE_GOV_TEO

          # --- ZSWAP 独占负载模式 ---
          # 从 zswap 读取的页面自动从 swap 后端删除（节省 I/O）
          scripts/config --enable ZSWAP_EXCLUSIVE_LOADS_DEFAULT_ON

          # --- 内核模块 ZSTD 压缩 ---
          # 减少 /lib/modules 磁盘占用和模块加载时间
          scripts/config --enable MODULE_COMPRESS
          scripts/config --enable MODULE_COMPRESS_ZSTD
          scripts/config --disable MODULE_COMPRESS_NONE

          # --- Haltpoll CPU 空闲（虚拟化加速）---
          # VM 中在 halt 前自旋等待，减少 VMEXIT 延迟
          scripts/config --enable HALTPOLL_CPUIDLE

          # --- 网络补充优化 ---
          # TLS 内核卸载（VPS 用于反向代理加速）
          scripts/config --module TLS
          scripts/config --enable TLS_DEVICE
          # MPTCP（多路径 TCP，提升网络弹性）
          scripts/config --enable MPTCP
          # XDP Sockets（高性能用户态包处理）
          scripts/config --enable XDP_SOCKETS

          # --- sched_ext（可加载外部调度器，实验特性）---
          scripts/config --enable SCHED_CLASS_EXT

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            make ARCH=arm64 olddefconfig
          else
            make olddefconfig
          fi

          # These are product guarantees, not optional optimization hints.
          for required in \
            'CONFIG_TCP_CONG_BBR=y' \
            'CONFIG_DEFAULT_TCP_CONG="bbr"' \
            'CONFIG_NET_SCH_FQ=y' \
            'CONFIG_DEFAULT_NET_SCH="fq"' \
            'CONFIG_DEBUG_INFO_BTF=y'; do
            grep -Fxq "$required" .config || { echo "::error::必需的内核配置未生效: $required"; exit 1; }
          done
          grep -Fxq "CONFIG_LOCALVERSION=\"${BUILD_SUFFIX}${PROFILE_SUFFIX}\"" .config || { echo "::error::构建标识未生效"; exit 1; }

          if [ "$PROFILE" = "aggressive" ]; then
            grep -Fxq 'CONFIG_TCP_CONG_BBR=y' .config || { echo "::error::激进版 BBR 未内置"; exit 1; }
            grep -q 'BBRV3_AGGRESSIVE_PROFILE' net/ipv4/tcp_bbr.c || { echo "::error::激进版源码补丁未生效"; exit 1; }
            # 明确 LOCALVERSION 以避免源码修改时附加 SCM 标记；XanMod 的
            # localversion 文件随后追加 -xanmodN，故名称为 -aggressive-xanmodN。
            KERNEL_RELEASE=$(make -s LOCALVERSION= kernelrelease)
            [[ "$KERNEL_RELEASE" =~ -aggressive-xanmod[0-9]+$ ]] || { echo "::error::激进版内核版本标识不正确: $KERNEL_RELEASE"; exit 1; }
          fi

          # 保存配置文件副本用于后续上传（bindeb-pkg 会改变目录结构）
          cp .config ${{ github.workspace }}/kernel-config-${{ matrix.arch }}

          echo "=== 关键配置验证 ==="
          grep -E 'CONFIG_KERNEL_(XZ|ZSTD)=|CONFIG_TCP_CONG_BBR=|CONFIG_DEFAULT_TCP_CONG=|CONFIG_DEFAULT_NET_SCH=|CONFIG_BPF_JIT_ALWAYS_ON=|CONFIG_NO_HZ_(IDLE|FULL)=|CONFIG_SOUND=|CONFIG_DRM=|CONFIG_HYPERV=|CONFIG_MICROCODE=|CONFIG_PAGE_POOL_STATS=|CONFIG_ZSWAP_DEFAULT_ON=|CONFIG_DEBUG_INFO_BTF=|CONFIG_MODULE_COMPRESS_ZSTD=|CONFIG_RCU_NOCB_CPU_DEFAULT_ALL=|CONFIG_MPTCP=' .config || true

          echo "=== 检查关键配置是否生效 ==="
          UNEXPECTED=0
          grep -q 'CONFIG_KERNEL_ZSTD=y' .config || { echo "::warning::CONFIG_KERNEL_ZSTD 未生效！"; UNEXPECTED=$((UNEXPECTED + 1)); }
          grep -q 'CONFIG_NO_HZ_IDLE=y' .config || { echo "::warning::CONFIG_NO_HZ_IDLE 未生效！"; UNEXPECTED=$((UNEXPECTED + 1)); }
          grep -q 'CONFIG_BPF_JIT_ALWAYS_ON=y' .config || { echo "::warning::CONFIG_BPF_JIT_ALWAYS_ON 未生效！"; UNEXPECTED=$((UNEXPECTED + 1)); }
          grep -q 'CONFIG_TCP_CONG_BBR=y' .config || { echo "::warning::CONFIG_TCP_CONG_BBR 未生效！"; UNEXPECTED=$((UNEXPECTED + 1)); }
          grep -q 'CONFIG_MICROCODE=y' .config || { echo "::warning::CONFIG_MICROCODE 未生效！"; UNEXPECTED=$((UNEXPECTED + 1)); }
          grep -q 'CONFIG_DEBUG_INFO_BTF=y' .config || { echo "::warning::CONFIG_DEBUG_INFO_BTF 未生效！"; UNEXPECTED=$((UNEXPECTED + 1)); }
          grep -q 'CONFIG_MODULE_COMPRESS_ZSTD=y' .config || { echo "::warning::CONFIG_MODULE_COMPRESS_ZSTD 未生效！"; UNEXPECTED=$((UNEXPECTED + 1)); }
          grep -q 'CONFIG_RCU_NOCB_CPU_DEFAULT_ALL=y' .config || { echo "::warning::RCU_NOCB_CPU_DEFAULT_ALL 未生效！"; UNEXPECTED=$((UNEXPECTED + 1)); }
          if [ $UNEXPECTED -eq 0 ]; then
            echo "✅ 全部关键配置验证通过"
          else
            echo "::warning::${UNEXPECTED} 项关键配置未生效，请检查基础配置文件"
          fi

      - name: 🏗️ 构建内核 Debian 包
        working-directory: ./kernel/linux
        env:
          # 固定构建元数据，避免时间戳差异导致 ccache 缓存失效
          KBUILD_BUILD_TIMESTAMP: ''
          KBUILD_BUILD_USER: c000127
          KBUILD_BUILD_HOST: github
          # 使用 zstd 压缩 .deb 内部数据（压缩快、体积小）
          KDEB_COMPRESS: zstd
        run: |
          set -euo pipefail
          BUILD_START=$(date +%s)
          # -pipe: 使用管道替代临时文件传递编译阶段数据
          # -j$(nproc): 充分利用所有 CPU 核心
          if [ "$PROFILE" = "aggressive" ]; then
            make bindeb-pkg -j$(nproc) LOCALVERSION= \
              KCFLAGS="-pipe"
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            make ARCH=arm64 bindeb-pkg -j$(nproc) LOCALVERSION= \
              KCFLAGS="-pipe"
          else
            make bindeb-pkg -j$(nproc) LOCALVERSION= \
              KCFLAGS="-pipe"
          fi
          BUILD_END=$(date +%s)
          echo "编译耗时: $(( (BUILD_END - BUILD_START) / 60 )) 分 $(( (BUILD_END - BUILD_START) % 60 )) 秒"
          echo "ccache 命中统计:"
          ccache -s || true
          # 清理过期缓存条目，保持缓存精简（减少 Actions cache 体积）
          ccache -c || true

          # 清理不需要上传的包：
          #   -dbg: 调试符号包，启用 BTF 后超过 2GB，超出 GitHub release 上限
          #   linux-libc-dev: C 库头文件，运行时不需要
          cd ${{ github.workspace }}/kernel
          rm -fv linux-image-*-dbg_*.deb linux-libc-dev_*.deb
          echo "最终上传的 .deb 文件："
          ls -lh linux-*.deb

      - name: 🧾 为新产物生成独立名称和构建记录
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(./kernel/linux-*.deb)
          [[ ${#packages[@]} -gt 0 ]] || { echo "::error::未生成 Debian 包"; exit 1; }
          for package in "${packages[@]}"; do
            [[ "$package" == *_amd64.deb ]] || { echo "::error::不支持的包架构: $package"; exit 1; }
            mv -- "$package" "${package%_amd64.deb}-build${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}_amd64.deb"
          done
          images=(./kernel/linux-image-*.deb)
          [[ ${#images[@]} -eq 1 ]] || { echo "::error::必须恰有一个内核镜像"; exit 1; }
          image_name=$(dpkg-deb -f "${images[0]}" Package)
          kernel_release=${image_name#linux-image-}
          kernel_release=${kernel_release#unsigned-}
          compiler=$(gcc --version | head -1)
          python3 scripts/build_provenance.py manifest \
            --profile "$PROFILE" --tag "$XANMOD_TAG" --source-commit "$SOURCE_COMMIT" \
            --project-commit "$GITHUB_SHA" --fingerprint "$BUILD_FINGERPRINT" \
            --kernel-release "$kernel_release" --compiler "$compiler" \
            --config "kernel-config-${{ matrix.arch }}" --package-dir ./kernel \
            > "$RUNNER_TEMP/build-manifest.json"
          cp "$RUNNER_TEMP/build-manifest.json" ./kernel/build-manifest.json
          echo "KERNEL_RELEASE=$kernel_release" >> "$GITHUB_ENV"

      - name: 📤 上传配置文件
        uses: actions/upload-artifact@v7
        with:
          name: config-${{ matrix.arch }}-${{ env.XANMOD_BRANCH }}${{ env.PROFILE_SUFFIX }}
          path: ${{ github.workspace }}/kernel-config-${{ matrix.arch }}

      - name: 📤 上传 Deb 包
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}-${{ env.XANMOD_BRANCH }}${{ env.PROFILE_SUFFIX }}
          path: |
            ./kernel/linux-*.deb
            ./kernel/build-manifest.json

      - name: 🎉 发布到 GitHub Release
        if: inputs.publish == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          make_latest: ${{ env.PROFILE == 'standard' && 'true' || 'false' }}
          files: ./kernel/linux-*.deb

      - name: 🔄 更新 Release 说明
        if: inputs.publish == true
        run: |
          set -euo pipefail
          TAG="${{ env.RELEASE_TAG }}"
          curl -sf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" > "$RUNNER_TEMP/release.json"
          RELEASE_ID=$(jq -er '.id' "$RUNNER_TEMP/release.json")
            if [ "$PROFILE" = "aggressive" ]; then
              VARIANT="实验性激进版：STARTUP 3.0×、CRUISE 1.2×、BBR 内部丢包阈值 25%；保留 ECN 和其他恢复机制。该阈值不保证实际丢包容忍率，可能增加重传及共享链路负载。"
            else
              VARIANT="BBRv3 (default) · fq · NO_HZ_IDLE · PREEMPT_LAZY · HZ=250 · ZSTD · BTF · GCC 16"
            fi
            BODY="## Linux ${{ env.KERNEL_VERSION }} + BBRv3${{ env.PROFILE_SUFFIX }}

          **XanMod** ${{ env.XANMOD_TAG }} · **x86_64** · ${{ env.BUILD_TIMESTAMP }} UTC

          ${VARIANT}

          ### 安装
          \`\`\`bash
          bash <(curl -fsSL https://raw.githubusercontent.com/c000127/Actions-bbr-v3/main/install.sh)
          \`\`\`
          手动安装时请仅下载下列当前构建的镜像及配套头文件，并按发行版文档安装。

          > 支持 Debian 13 及以后版本 · 安装后需重启"

            printf '%s\n' "$BODY" > "$RUNNER_TEMP/default-release-body.txt"
            python3 scripts/build_provenance.py release-body \
              --manifest "$RUNNER_TEMP/build-manifest.json" \
              --release "$RUNNER_TEMP/release.json" \
              --default-body "$RUNNER_TEMP/default-release-body.txt" > "$RUNNER_TEMP/release-body.txt"

            curl -sf -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}" \
              -d "$(jq -n --rawfile body "$RUNNER_TEMP/release-body.txt" '{body: $body}')"
            echo "已验证资源并更新当前构建记录；旧资源保持可用"

      - name: 🧹 清理旧 ccache 缓存条目
        if: always() && inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 仅在构建配置与缓存前缀均已确定时清理，避免误删其他配置的缓存。
          if [[ -z "${XANMOD_BRANCH:-}" || -z "${CACHE_PREFIX:-}" ]]; then
            echo "缓存前缀未设置，跳过缓存清理"
            exit 0
          fi
          # 删除当前 arch+xanmod_branch 的所有旧缓存条目（排除本次即将保存的 key）
          # actions/cache 的 post-action 会在 job 结束时保存新条目
          # 避免旧条目堆积超出 GitHub Actions 10 GB 总缓存限额
          PREFIX="${CACHE_PREFIX}"
          CURRENT_KEY="${CACHE_PREFIX}${{ github.run_id }}-${{ github.run_attempt }}"
          echo "清理缓存前缀: ${PREFIX}（保留: ${CURRENT_KEY}）"
          gh cache list --key "${PREFIX}" --json key -q '.[].key' | while read key; do
            if [ "${key}" = "${CURRENT_KEY}" ]; then
              echo "跳过当前缓存: ${key}"
              continue
            fi
            echo "删除旧缓存: ${key}"
            gh cache delete "${key}" || true
          done
