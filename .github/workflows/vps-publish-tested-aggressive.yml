name: 临时发布已验证的激进版产物

on:
  push:
    branches: [codex/aggressive-bbr-v3-build]
    paths: [.github/workflows/vps-publish-tested-aggressive.yml]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: kernel-${{ github.repository }}-x86_64-aggressive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 验证构建来源及现有 Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha=40f6154cd6278570da2debcb4a217a105b448785
          info=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/40546954234" --jq '.conclusion + " " + .head_sha')
          [[ "$info" == "success $source_sha" ]] || { echo '双构建尚未成功'; exit 1; }
          git diff --quiet "$source_sha" HEAD -- .github/workflows/build.yml x86-64-aggressive.config scripts/apply-aggressive-bbr.py
          status=$(curl --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/release.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/aggressive-x86_64-7.3.0")
          case "$status" in
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            200)
              printf 'null\n' > "$RUNNER_TEMP/standard.json"
              python3 scripts/plan-pair-build.py 7.3.0-xanmod1 "$RUNNER_TEMP/standard.json" "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/plan.txt"
              grep -Fxq 'build_aggressive=false' "$RUNNER_TEMP/plan.txt" || { echo '已存在不完整的 Release，停止以避免覆盖'; exit 1; }
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              ;;
            *) echo "查询现有 Release 失败 (HTTP $status)"; exit 1 ;;
          esac
      - name: 下载已验证的激进版内核包
        if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: deb-x86_64-7.3-aggressive
          run-id: 40546954234
          github-token: ${{ github.token }}
          path: ./packages
      - name: 验证 Debian 包
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(packages/*.deb)
          images=(packages/linux-image-7.3.0-aggressive-xanmod1_*_amd64.deb)
          headers=(packages/linux-headers-7.3.0-aggressive-xanmod1_*_amd64.deb)
          [[ ${#debs[@]} -eq 2 && ${#images[@]} -eq 1 && ${#headers[@]} -eq 1 ]]
          [[ "$(dpkg-deb -f "${images[0]}" Package)" == linux-image-7.3.0-aggressive-xanmod1 ]]
          [[ "$(dpkg-deb -f "${headers[0]}" Package)" == linux-headers-7.3.0-aggressive-xanmod1 ]]
          [[ "$(dpkg-deb -f "${images[0]}" Version)" == "$(dpkg-deb -f "${headers[0]}" Version)" ]]
          sha256sum "${debs[@]}"
      - name: 发布独立激进版 Release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: aggressive-x86_64-7.3.0
          target_commitish: main
          make_latest: 'false'
          fail_on_unmatched_files: true
          overwrite_files: false
          files: ./packages/*.deb
          body: |
            ## Linux 7.3.0 + 实验性激进 BBRv3

            **XanMod** 7.3.0-xanmod1 · **x86_64** · 与标准版使用同一上游标签构建。

            STARTUP 3.0×、CRUISE 约 1.2×、BBR 内部丢包阈值 25%；该阈值不保证实际链路的丢包容忍率。
            激进参数可能增加重传、排队延迟和共享链路负载。

            ### 安装
            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/c000127/Actions-bbr-v3/main/install.sh)
            ```

            菜单 6 安装激进版；自动 BBR 配置仅在激进内核且无其他拥塞算法冲突时生效。
            安装后请按照 README 检查 GRUB 启动项及运行中的内核版本。
